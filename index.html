<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basketball Club Update</title>

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2025.3.1/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js"
    ></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            padding: 20px;
            border-radius: 18px;
            background-color: rgb(250, 242, 242);
        }

        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
            color: #1e3a8a;
            font-size: 28px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #2563eb;
         
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            background-color:  #dae109;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #dae109;
        }

        #output1 {
            min-height: 55px;
            margin-top: 22px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: #1e293b;
            background-color: #f1f5f9;
            font-weight: bold;
            line-height: 1.5;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>ICT Club Verification</h1>
            <p>Check if you are part of the ICT Club.</p>
        </header>

        <div class="form-group">
            <label for="first_name">First Name</label>

            <input
                type="text"
                id="first_name"
                placeholder="Enter your first name"
            >
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>

            <input
                type="text"
                id="last_name"
                placeholder="Enter your last name"
            >
        </div>

        <button py-click="verify_member">
            Verify Member
        </button>

        <div id="output1">
            Your result will appear here.
        </div>
    </main>

    <script type="py" src="main.py"></script>

</body>

</html>
